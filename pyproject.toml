[project]
name = "nthu-data-api"
version = "2.0.0"
description = "NTHU Data API"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    {name = "NTHU-SA", email = "it@nthusa.tw"}
]
dependencies = [
    "beautifulsoup4",
    "fastapi",
    "fastmcp",
    "httpx[http2]",
    "jieba",
    "lxml",
    "pandas",
    "pydantic-settings",
    "python-dotenv",
    "python-levenshtein",
    "thefuzz",
    "truststore",
    "uvicorn",
]

[dependency-groups]
dev = [
    "black",
    "isort",
    "pre-commit",
]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-xdist",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 100

[tool.black]
line-length = 100
target-version = ['py314']

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
asyncio_mode = "auto"
